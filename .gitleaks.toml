# Configuracion del escaneo de secretos.
#
# Parte de las reglas por defecto de gitleaks. La tentacion al ver un falso
# positivo es relajar la regla; aqui se hace lo contrario: si hace falta
# perdonar algo, se nombra el valor exacto y se explica por que.
#
# Un escaner de secretos que grita demasiado acaba ignorandose, y un escaner
# que se ignora es peor que no tenerlo: da tranquilidad sin darla.

[extend]
useDefault = true

# Contrasena FALSA de las pruebas del cliente de identidad. Sirve para comprobar que el cuerpo de "crear cuenta" lleva la
# contrasena que se escribio y que viaja solo al servicio de identidad; no es de ninguna cuenta. La regla de claves genericas
# la toma por una clave porque se escribe junto al nombre `password`. Se nombra el valor exacto; no se perdona ninguna regla.
[[allowlists]]
description = "Contrasena falsa de las pruebas del cliente de identidad"
regexes = ['''^S3cretoLargo123$''']
