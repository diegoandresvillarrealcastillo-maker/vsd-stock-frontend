<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>VSD Stock</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      La aplicacion instalable (C3-07): el manifiesto, el icono del iPhone y el color de la barra del navegador, el mismo
      de la banda de la cabecera en cada tema (la prueba test/pwa/manifest.spec.ts lo comprueba contra los tokens).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a1a3f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1f44" media="(prefers-color-scheme: dark)" />
    <!--
      Pinta el tema antes de que arranque React: si esperara a React, se veria un
      destello del tema equivocado. Decide igual que ThemePreferenceUseCase
      (lo guardado, y si no hay, la preferencia del sistema); la prueba
      test/design/theme-bootstrap.spec.ts lo comprueba.
    -->
    <script>
      (function () {
        var mode = null;
        try {
          mode = window.localStorage.getItem('vsd-stock-theme');
        } catch (_) {
          // Almacenamiento bloqueado: se sigue al sistema.
        }
        if (mode !== 'light' && mode !== 'dark') {
          mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/infrastructure/main.tsx"></script>
  </body>
</html>
